---
include:
  # Minimal diagnostic build: no OLED and no Studio
  - board: nice_nano_v2
    shield: custom_keyboard
    cmake-args: -DCONFIG_ZMK_DISPLAY=n
    artifact-name: custom_keyboard_diagnostic

  # Complete firmware
  - board: nice_nano_v2
    shield: custom_keyboard
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: custom_keyboard

  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings_reset
 
  # OLED UI on its own low-priority work queue
  - board: nice_nano_v2
    shield: custom_keyboard
    snippet: zmk-usb-logging
    cmake-args: "-DCONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y -DCONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096 -DCONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=10 -DCONFIG_ZMK_LOG_LEVEL_DBG=y -DCONFIG_DISPLAY_LOG_LEVEL_DBG=y -DCONFIG_I2C_LOG_LEVEL_DBG=y"
    artifact-name: custom_keyboard_oled_dedicated_log