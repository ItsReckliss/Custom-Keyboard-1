---
include:
  # Minimal diagnostic build: no OLED and no Studio
  - board: nice_nano_v2
    shield: custom_keyboard
    cmake-args: -DCONFIG_ZMK_DISPLAY=n
    artifact-name: custom_keyboard_diagnostic

  # Complete firmware
  - board: nice_nano_v2
    shield: custom_keyboard
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: custom_keyboard

  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings_reset
 
  # I2C scanner: display driver disabled so a bad OLED cannot stall startup
  - board: nice_nano_v2
    shield: custom_keyboard
    snippet: zmk-usb-logging
    cmake-args: "-DCONFIG_ZMK_DISPLAY=n -DCONFIG_SSD1306=n -DCONFIG_I2C=y -DCONFIG_SHELL=y -DCONFIG_I2C_SHELL=y -DCONFIG_SENSOR_SHELL=n"
    artifact-name: custom_keyboard_i2c_scanner